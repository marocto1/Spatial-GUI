name: Forge 1.20.1 Compatibility Matrix

on:
  push:
    branches:
      - forge-1.20.1-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    name: compat-${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [jei, emi, embeddium, oculus]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Resolve and deobfuscate compatibility mods
        shell: bash
        run: |
          set -euo pipefail

          modrinth_version() {
            local slug="$1"
            curl -fsSLG "https://api.modrinth.com/v2/project/${slug}/version" \
              --data-urlencode 'loaders=["forge"]' \
              --data-urlencode 'game_versions=["1.20.1"]' \
              | jq -r '.[0].version_number'
          }

          COORDS=''
          add_coord() {
            local slug="$1"
            local version
            version=$(modrinth_version "$slug")
            test -n "$version"
            test "$version" != 'null'
            local coord="maven.modrinth:${slug}:${version}"
            if [ -z "$COORDS" ]; then COORDS="$coord"; else COORDS="$COORDS;$coord"; fi
            echo "Resolved ${slug} -> ${version}"
          }

          case "${{ matrix.suite }}" in
            jei) add_coord jei ;;
            emi) add_coord emi ;;
            embeddium) add_coord embeddium ;;
            oculus)
              add_coord embeddium
              add_coord oculus
              ;;
          esac

          echo "SPATIAL_COMPAT_COORDS=$COORDS" >> "$GITHUB_ENV"

          cat >> build.gradle <<'GRADLE'

          // Audit-only compatibility dependencies. Production Modrinth jars use
          // SRG/obfuscated names, so ForgeGradle must deobfuscate them before
          // forgeclientuserdev can load their mixins and Minecraft references.
          if (isForge && System.getenv('SPATIAL_COMPAT_COORDS')) {
              repositories {
                  maven { url = uri('https://api.modrinth.com/maven') }
              }
              dependencies {
                  System.getenv('SPATIAL_COMPAT_COORDS').split(';').each { coord ->
                      runtimeOnly fg.deobf(coord)
                  }
              }
          }
          GRADLE

          tail -n 20 build.gradle

      - name: Build Spatial GUI and mapped compatibility runtime
        run: ./gradlew :1.20.1-forge:build --stacktrace

      - name: Prepare disposable singleplayer world
        shell: bash
        run: |
          set -euo pipefail
          VERSION_URL=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json \
            | jq -r '.versions[] | select(.id == "1.20.1") | .url')
          SERVER_URL=$(curl -fsSL "$VERSION_URL" | jq -r '.downloads.server.url')
          mkdir -p /tmp/mc-worldgen
          cd /tmp/mc-worldgen
          curl -fsSL "$SERVER_URL" -o server.jar
          printf 'eula=true\n' > eula.txt
          printf 'level-name=world\nonline-mode=false\nview-distance=2\nsimulation-distance=2\n' > server.properties
          (sleep 35; echo stop) | java -Xms512M -Xmx1G -jar server.jar nogui > worldgen.log 2>&1
          test -f world/level.dat
          mkdir -p "$GITHUB_WORKSPACE/versions/1.20.1-forge/run/saves"
          cp -a world "$GITHUB_WORKSPACE/versions/1.20.1-forge/run/saves/SmokeWorld"

          cd "$GITHUB_WORKSPACE"
          sed -i "/property 'forge.logging.console.level', 'info'/a\\                args '--quickPlaySingleplayer', 'SmokeWorld'" build.gradle

      - name: Launch world, open inventory, capture screenshot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdotool >/dev/null

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 > xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2

          ./gradlew :1.20.1-forge:runClient --no-daemon --stacktrace > smoke-console.log 2>&1 &
          CLIENT_PID=$!
          LOG='versions/1.20.1-forge/run/logs/latest.log'

          WORLD_READY=0
          for i in $(seq 1 210); do
            if [ -f "$LOG" ] && grep -E -q \
              'Starting integrated minecraft server|Preparing start region|Time elapsed:|Loaded [0-9]+ advancements' "$LOG"; then
              WORLD_READY=1
              break
            fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then break; fi
            sleep 1
          done

          if [ "$WORLD_READY" -ne 1 ]; then
            echo 'World did not reach integrated server stage.'
            tail -n 320 "$LOG" 2>/dev/null || true
            exit 1
          fi

          sleep 15
          WINDOW=$(xdotool search --name 'Minecraft' 2>/dev/null | head -n 1 || true)
          test -n "$WINDOW"
          echo "Minecraft window: $WINDOW ($(xdotool getwindowname "$WINDOW" 2>/dev/null || true))"
          xdotool windowfocus --sync "$WINDOW"
          xdotool key --window "$WINDOW" e
          echo 'Sent inventory key (E).'
          sleep 8
          xdotool key --window "$WINDOW" F2
          echo 'Requested Minecraft screenshot (F2).'
          sleep 17

          if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
            echo 'Minecraft exited during compatibility smoke window.'
            tail -n 360 "$LOG" || true
            exit 1
          fi

          if grep -E -i \
            'Mixin apply.*failed|InvalidInjectionException|MixinTransformerError|ClassCastException|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|org\.tastytrash\.spatialGUI.*(Exception|Error)' "$LOG"; then
            echo 'Fatal compatibility signature detected.'
            tail -n 360 "$LOG" || true
            exit 1
          fi

          mkdir -p compat-output
          cp "$LOG" "compat-output/latest-${{ matrix.suite }}.log"
          cp smoke-console.log "compat-output/console-${{ matrix.suite }}.log"
          cp xvfb.log "compat-output/xvfb-${{ matrix.suite }}.log"
          find versions/1.20.1-forge/run/screenshots -type f -name '*.png' -print -exec cp {} compat-output/ \; 2>/dev/null || true

          echo "Compatibility smoke passed for ${{ matrix.suite }}."
          kill -INT "$CLIENT_PID" 2>/dev/null || true
          sleep 3
          kill -KILL "$CLIENT_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

      - name: Verify expected mod loaded and Spatial GUI initialized
        shell: bash
        run: |
          set -euo pipefail
          LOG="compat-output/latest-${{ matrix.suite }}.log"
          grep -F 'Initializing Spatial GUI' "$LOG"
          case "${{ matrix.suite }}" in
            jei) grep -Ei 'jei|Just Enough Items' "$LOG" >/dev/null ;;
            emi) grep -Ei 'emi' "$LOG" >/dev/null ;;
            embeddium) grep -Ei 'embeddium' "$LOG" >/dev/null ;;
            oculus) grep -Ei 'oculus' "$LOG" >/dev/null && grep -Ei 'embeddium' "$LOG" >/dev/null ;;
          esac
          echo "Verified ${{ matrix.suite }} was present in the runtime log."

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-gui-compat-mapped-${{ matrix.suite }}
          path: |
            compat-output/
            versions/1.20.1-forge/run/logs/latest.log
            smoke-console.log
            /tmp/mc-worldgen/worldgen.log
          if-no-files-found: warn
