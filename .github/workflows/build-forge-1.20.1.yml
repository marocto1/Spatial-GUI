name: Build Forge 1.20.1

on:
  workflow_dispatch:
  push:
    branches:
      - forge-1.20.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Build Forge 1.20.1
        run: ./gradlew :1.20.1-forge:build --stacktrace
      - name: Verify Forge mixin manifest
        run: |
          JAR="versions/1.20.1-forge/build/libs/spatial-gui-1.6+1.20.1-forge.jar"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tee manifest.txt
          grep -F "MixinConfigs: spatial-gui.mixins.json" manifest.txt
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: spatial-gui-1.20.1-forge-r3
          path: versions/1.20.1-forge/build/libs/*.jar
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.6-forge-1.20.1-r3"
          RELEASE_TITLE="Spatial GUI 1.6 — Forge 1.20.1 Backport r3"
          RELEASE_JAR="versions/1.20.1-forge/build/libs/spatial-gui-1.6+1.20.1-forge.jar"

          cat > release-notes.md <<'EOF'
          ## Spatial GUI 1.6 — Forge 1.20.1 Backport r3

          This is the **third revision of the unofficial Spatial GUI 1.6 backport for Minecraft 1.20.1 Forge**.

          ### What changed in r3

          - Fixed Spatial GUI mixins not being registered on Forge 1.20.1.
          - Adds `MixinConfigs: spatial-gui.mixins.json` to the final JAR manifest.
          - Fixes the runtime `ClassCastException` involving `GameRenderer` and `GameRendererInvoker` when opening inventory/container screens.
          - Keeps the `pack.mcmeta` resource-pack fix from r2.
          - MixinExtras 0.5.5 remains bundled inside the JAR.

          ### Port details

          - Minecraft: **1.20.1**
          - Mod loader: **Forge 47.4.x**
          - Java: **17**
          - Spatial GUI base version: **1.6**
          - Required dependency: **Cloth Config 11.x for Forge**
          - Forge-specific screen hooks, events, keybind handling and rendering integration are included
          - The final JAR is reobfuscated and built automatically through GitHub Actions

          ### Important

          This is **not an official upstream Spatial GUI release**. It is an unofficial compatibility backport/fork for Minecraft 1.20.1 Forge.

          Original project by **tastytrash**:
          https://github.com/tastytrash/Spatial-GUI

          The original project is distributed under the **MIT License**. Attribution and license are preserved.

          ### Socials

          Telegram: **@MaroctoDestiny**  
          https://t.me/MaroctoDestiny
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_JAR" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "$RELEASE_JAR" \
              --target forge-1.20.1 \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi
