name: Build Forge 1.20.1

on:
  workflow_dispatch:
  push:
    branches:
      - forge-1.20.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Build Forge 1.20.1
        run: ./gradlew :1.20.1-forge:build --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: spatial-gui-1.20.1-forge
          path: versions/1.20.1-forge/build/libs/*.jar
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.6-forge-1.20.1"
          RELEASE_TITLE="Spatial GUI 1.6 — Forge 1.20.1 Backport"
          RELEASE_JAR="versions/1.20.1-forge/build/libs/spatial-gui-1.6+1.20.1-forge.jar"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_JAR" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_JAR" \
              --target forge-1.20.1 \
              --title "$RELEASE_TITLE" \
              --notes "Unofficial community backport of Spatial GUI by tastytrash for Minecraft 1.20.1 Forge 47.4.x. Requires Cloth Config 11.x. Original project is MIT licensed. This is not an official upstream release."
          fi
