name: Build Forge 1.20.1

on:
  workflow_dispatch:
  push:
    branches:
      - forge-1.20.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Build Forge 1.20.1
        run: ./gradlew :1.20.1-forge:build --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: spatial-gui-1.20.1-forge
          path: versions/1.20.1-forge/build/libs/*.jar
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.6-forge-1.20.1"
          RELEASE_TITLE="Spatial GUI 1.6 — Forge 1.20.1 Backport"
          RELEASE_JAR="versions/1.20.1-forge/build/libs/spatial-gui-1.6+1.20.1-forge.jar"

          cat > release-notes.md <<'EOF'
          ## Spatial GUI 1.6 — Forge 1.20.1 Backport

          This release is an **unofficial community backport of Spatial GUI 1.6 to Minecraft 1.20.1 Forge**.

          The original mod targets newer Minecraft versions and other loader targets. This fork adapts the project so Spatial GUI can run on the classic **Minecraft 1.20.1 + Forge 47.4.x** stack while preserving the original 3D inventory/container interface as closely as possible.

          ### Port details

          - Minecraft: **1.20.1**
          - Mod loader: **Forge 47.4.x**
          - Java: **17**
          - Spatial GUI base version: **1.6**
          - Required dependency: **Cloth Config 11.x for Forge**
          - MixinExtras is bundled inside the release JAR
          - Forge-specific screen hooks, events, keybind handling and rendering integration were added for 1.20.1
          - The final JAR is reobfuscated and built automatically through GitHub Actions

          ### Important

          This is **not an official upstream Spatial GUI release**. It is a compatibility backport/fork made specifically for players and modpacks that remain on Minecraft 1.20.1 Forge.

          Original project by **tastytrash**:
          https://github.com/tastytrash/Spatial-GUI

          The original project is distributed under the **MIT License**. The original license and attribution are preserved in this fork and release.

          ### Socials

          Telegram: **@MaroctoDestiny**  
          https://t.me/MaroctoDestiny
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_JAR" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "$RELEASE_JAR" \
              --target forge-1.20.1 \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi

# Release notes include the 1.20.1 port details and Marocto social links.
