name: Build Forge 1.20.1

on:
  workflow_dispatch:
  push:
    branches:
      - forge-1.20.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Build Forge 1.20.1
        run: ./gradlew :1.20.1-forge:build --stacktrace
      - name: Verify Forge mixin metadata and 1.20.1 hooks
        run: |
          JAR="versions/1.20.1-forge/build/libs/spatial-gui-1.6+1.20.1-forge.jar"
          GAME_RENDERER="versions/1.20.1-forge/build/generated/stonecutter/main/java/org/tastytrash/spatialGUI/mixin/render/GameRendererMixin.java"
          HUD="versions/1.20.1-forge/build/generated/stonecutter/main/java/org/tastytrash/spatialGUI/mixin/gui/HudMixin.java"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tee manifest.txt
          grep -F "MixinConfigs: spatial-gui.mixins.json" manifest.txt
          unzip -l "$JAR" | grep -F "spatial-gui.refmap.json"
          unzip -p "$JAR" spatial-gui.mixins.json | tee mixins.json
          grep -F '"refmap": "spatial-gui.refmap.json"' mixins.json
          unzip -p "$JAR" spatial-gui.refmap.json | grep -F 'renderBackground'
          grep -F '@Redirect(method = "render", require = 0, at = @At(' "$GAME_RENDERER"
          grep -F 'net.minecraftforge.client.ForgeHooksClient.drawScreen' "$GAME_RENDERER"
          grep -F '@ModifyExpressionValue(method = "render", at = @At(value = "FIELD", target = "Lnet/minecraft/client/Options;hideGui:Z"), require = 0)' "$HUD"
          if grep -F 'renderScoreboardSidebar' "$HUD"; then
            echo "Legacy HUD targets unexpectedly present in generated 1.20.1 source"
            exit 1
          fi
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: spatial-gui-1.20.1-forge-r6
          path: versions/1.20.1-forge/build/libs/*.jar
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.6-forge-1.20.1-r6"
          RELEASE_TITLE="Spatial GUI 1.6 — Forge 1.20.1 Backport r6"
          RELEASE_JAR="versions/1.20.1-forge/build/libs/spatial-gui-1.6+1.20.1-forge.jar"

          cat > release-notes.md <<'EOF'
          ## Spatial GUI 1.6 — Forge 1.20.1 Backport r6

          This is the **sixth revision of the unofficial Spatial GUI 1.6 backport for Minecraft 1.20.1 Forge**.

          ### What changed in r6

          - Fixed the Minecraft 1.20.1 `HudMixin` startup crash.
          - Removed legacy HUD injection targets (`renderScoreboardSidebar`, `renderOverlayMessage`, `renderTitle`, `renderChat`, `renderTabList`) from the generated 1.20.1 hook path.
          - Ports the `hideHud` behaviour to the `Options.hideGui` access inside `Gui.render`, which matches the 1.20.1 HUD pipeline.
          - Keeps the Forge `ScreenEvent.Render.Pre` capture path and non-fatal GameRenderer fallback from r5.
          - Keeps the production Mixin refmap fix from r4.
          - Keeps the Forge mixin manifest registration from r3.
          - Keeps the `pack.mcmeta` resource metadata fix from r2.
          - MixinExtras 0.5.5 remains bundled inside the JAR.

          ### Port details

          - Minecraft: **1.20.1**
          - Mod loader: **Forge 47.4.x**
          - Java: **17**
          - Spatial GUI base version: **1.6**
          - Required dependency: **Cloth Config 11.x for Forge**
          - The final JAR is reobfuscated and built automatically through GitHub Actions

          ### Important

          This is **not an official upstream Spatial GUI release**. It is an unofficial compatibility backport/fork for Minecraft 1.20.1 Forge.

          Original project by **tastytrash**:
          https://github.com/tastytrash/Spatial-GUI

          The original project is distributed under the **MIT License**. Attribution and license are preserved.

          ### Socials

          Telegram: **@MaroctoDestiny**  
          https://t.me/MaroctoDestiny
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_JAR" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "$RELEASE_JAR" \
              --target forge-1.20.1 \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi
