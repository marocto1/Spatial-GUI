name: Build Forge 1.20.1

on:
  workflow_dispatch:
  push:
    branches:
      - forge-1.20.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Build Forge 1.20.1
        run: ./gradlew :1.20.1-forge:build --stacktrace
      - name: Verify Forge 1.20.1 build
        run: |
          JAR="versions/1.20.1-forge/build/libs/spatial-gui-1.6+1.20.1-forge.jar"
          GAME_RENDERER="versions/1.20.1-forge/build/generated/stonecutter/main/java/org/tastytrash/spatialGUI/mixin/render/GameRendererMixin.java"
          HUD="versions/1.20.1-forge/build/generated/stonecutter/main/java/org/tastytrash/spatialGUI/mixin/gui/HudMixin.java"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tee manifest.txt
          grep -F "MixinConfigs: spatial-gui.mixins.json" manifest.txt
          unzip -l "$JAR" | grep -F "spatial-gui.refmap.json"
          unzip -l "$JAR" | grep -F "pack.mcmeta"
          unzip -p "$JAR" spatial-gui.mixins.json | tee mixins.json
          grep -F '"refmap": "spatial-gui.refmap.json"' mixins.json
          unzip -p "$JAR" spatial-gui.refmap.json | grep -F 'renderBackground'
          grep -F '@Redirect(method = "render", require = 0, at = @At(' "$GAME_RENDERER"
          grep -F 'net.minecraftforge.client.ForgeHooksClient.drawScreen' "$GAME_RENDERER"
          grep -F '@ModifyExpressionValue(method = "render", at = @At(value = "FIELD", target = "Lnet/minecraft/client/Options;hideGui:Z"), require = 0)' "$HUD"
          if grep -F 'renderScoreboardSidebar' "$HUD"; then
            echo "Legacy HUD targets unexpectedly present in generated 1.20.1 source"
            exit 1
          fi
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: spatial-gui-1.6-forge-1.20.1
          path: versions/1.20.1-forge/build/libs/*.jar
          if-no-files-found: error
      - name: Replace revision history with initial release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.6-forge-1.20.1"
          RELEASE_TITLE="Spatial GUI 1.6 — Forge 1.20.1 Backport"
          RELEASE_JAR="versions/1.20.1-forge/build/libs/spatial-gui-1.6+1.20.1-forge.jar"

          for TAG in \
            v1.6-forge-1.20.1 \
            v1.6-forge-1.20.1-r2 \
            v1.6-forge-1.20.1-r3 \
            v1.6-forge-1.20.1-r4 \
            v1.6-forge-1.20.1-r5 \
            v1.6-forge-1.20.1-r6
          do
            gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          done

          cat > release-notes.md <<'EOF'
          ## Spatial GUI 1.6 — Forge 1.20.1 Backport

          Unofficial community backport of **Spatial GUI 1.6** for **Minecraft 1.20.1 Forge**.

          ### Compatibility

          - Minecraft **1.20.1**
          - Forge **47.4.x**
          - Java **17**
          - Cloth Config **11.x for Forge** required
          - MixinExtras **0.5.5** bundled in the JAR

          ### Forge 1.20.1 port

          This build ports Spatial GUI's client rendering and interaction systems to the Minecraft 1.20.1 Forge pipeline, including Forge screen events, keybind handling, production Mixin mappings/refmap, HUD handling, resource metadata and reobfuscated distribution packaging.

          The backport keeps the original Spatial GUI concept and behaviour while adapting loader- and version-specific hooks for Forge 47.4.x.

          ### Credits and license

          This is **not an official upstream Spatial GUI release**.

          Original project by **tastytrash**:
          https://github.com/tastytrash/Spatial-GUI

          Spatial GUI is distributed under the **MIT License**. Original attribution and license are preserved in this backport.

          ### Socials

          Telegram: **@MaroctoDestiny**  
          https://t.me/MaroctoDestiny
          EOF

          gh release create "$RELEASE_TAG" "$RELEASE_JAR" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md
