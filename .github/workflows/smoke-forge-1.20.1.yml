name: Forge 1.20.1 Client Smoke Test

on:
  push:
    branches:
      - forge-1.20.1-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Build Forge 1.20.1
        run: ./gradlew :1.20.1-forge:build --stacktrace
      - name: Launch real Forge client under Xvfb
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=15s 120s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            ./gradlew :1.20.1-forge:runClient --no-daemon --stacktrace \
            > smoke-console.log 2>&1
          STATUS=$?
          set -e

          LOG='versions/1.20.1-forge/run/logs/latest.log'
          echo "runClient exit status: $STATUS"
          echo '--- console tail ---'
          tail -n 120 smoke-console.log || true
          echo '--- latest.log tail ---'
          if [ -f "$LOG" ]; then
            tail -n 180 "$LOG"
          else
            echo 'latest.log was not created'
            exit 1
          fi

          if grep -E -i \
            'Mixin apply for mod spatial_gui failed|InvalidInjectionException|MixinTransformerError|ClassCastException.*spatialGUI|NoClassDefFoundError.*spatialGUI|NoSuchMethodError.*spatialGUI|NoSuchFieldError.*spatialGUI' \
            "$LOG"; then
            echo 'Spatial GUI fatal runtime signature detected.'
            exit 1
          fi

          if ! grep -E -q \
            'Initializing Spatial GUI|Backend library: LWJGL|Reloading ResourceManager|OpenAL initialized' \
            "$LOG"; then
            echo 'Client did not reach a meaningful Minecraft startup stage.'
            exit 1
          fi

          # 124 means timeout killed a still-running client after the smoke window.
          # That is expected once Minecraft reaches the menu and waits for input.
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ] && [ "$STATUS" -ne 130 ]; then
            echo "runClient exited unexpectedly with status $STATUS"
            exit "$STATUS"
          fi

          echo 'Forge 1.20.1 smoke test passed: no Spatial GUI fatal startup/mixin error found.'
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-gui-forge-1.20.1-smoke-logs
          path: |
            smoke-console.log
            versions/1.20.1-forge/run/logs/latest.log
          if-no-files-found: warn
