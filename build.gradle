buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:[6.0,6.2)'
    }
}

plugins {
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def dependencyVersions = [
        "26.1.2-fabric": [minecraft: "26.1.2", minecraft_dependency: "26.1.2", java: 25],
        "1.20.1-forge":  [minecraft: "1.20.1", minecraft_dependency: "[1.20.1,1.20.2)", forge: "1.20.1-47.4.20", cloth_config: "11.1.118", obfuscated: true, java: 17],
]

def nodeName = stonecutter.current.project
def loader = nodeName.substring(nodeName.lastIndexOf('-') + 1)
def isForge = loader == 'forge'
def currentVersions = dependencyVersions[nodeName]

if (currentVersions == null) {
    throw new GradleException("Unsupported Stonecutter node: ${nodeName}")
}

project.ext.minecraft_version = currentVersions.minecraft
project.ext.minecraft_dependency = currentVersions.minecraft_dependency
project.ext.is_obfuscated = currentVersions.obfuscated ?: false

if (isForge) {
    project.ext.cloth_config_version = currentVersions.cloth_config
    project.ext.forge_version = currentVersions.forge
    apply plugin: 'net.minecraftforge.gradle'

    base {
        archivesName = "${project.archives_base_name}-${project.version}+${project.minecraft_version}-${loader}"
    }

    repositories {
        mavenCentral()
        maven { name = "Cloth Config"; url = "https://maven.shedaniel.me/" }
        maven { name = "Forge"; url = "https://maven.minecraftforge.net" }
    }

    dependencies {
        minecraft "net.minecraftforge:forge:${project.forge_version}"
        implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:${project.cloth_config_version}")

        // Spatial GUI uses MixinExtras injectors such as @WrapMethod,
        // @ModifyExpressionValue and @ModifyReturnValue. Forge 1.20.1 does
        // not bundle MixinExtras, so embed the official Forge artifact.
        compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.5"))
        implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.5")) {
            jarJar.ranged(it, "[0.5.5,)")
        }
    }

    jarJar.enable()
    tasks.jarJar.finalizedBy('reobfJarJar')
    tasks.jarJar.archiveClassifier = ''

    minecraft {
        mappings channel: 'official', version: project.minecraft_version
        copyIdeResources = true
        runs {
            client {
                workingDirectory project.file('run')
                property 'forge.logging.console.level', 'info'
                mods {
                    spatial_gui {
                        source sourceSets.main
                    }
                }
            }
        }
    }

    processResources {
        inputs.property "version", project.version
        inputs.property "minecraft_version", project.minecraft_version
        inputs.property "minecraft_dependency", project.minecraft_dependency
        filteringCharset "UTF-8"

        exclude "fabric.mod.json"
        exclude "META-INF/neoforge.mods.toml"
        filesMatching("META-INF/mods.toml") {
            expand "version": project.version,
                    "minecraft_version": project.minecraft_version,
                    "minecraft_dependency": project.minecraft_dependency
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release.set(17)
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
        withSourcesJar()
    }

    jar {
        archiveVersion = ""
        archiveClassifier = 'plain'
        from("LICENSE.txt") {
            rename { "LICENSE_${project.archives_base_name}.txt" }
        }
    }

    publishing {
        publications {
            create("mavenJava", MavenPublication) {
                artifactId = project.archives_base_name
                artifact tasks.jarJar
            }
        }
    }
} else {
    // Upstream VCS/source node only. It exists so Stonecutter can transform
    // the checked-in 26.1.2 Fabric source into the generated 1.20.1 Forge node.
    apply plugin: 'base'
}
