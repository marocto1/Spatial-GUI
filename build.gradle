buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:[6.0,6.2)'
    }
}

plugins {
    id 'dev.kikugie.loom-back-compat' apply false
    id 'net.neoforged.moddev' version '2.0.147' apply false
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def dependencyVersions = [
        "1.20.1-fabric":   [minecraft: "1.20.1", minecraft_dependency: "1.20.1", fabric: "0.92.2+1.20.1", loader: "0.19.3", cloth_config: "11.1.106", modmenu: "7.2.2", obfuscated: true, java: 17],
        "1.20.1-forge":    [minecraft: "1.20.1", minecraft_dependency: "[1.20.1,1.20.2)", forge: "1.20.1-47.4.20", cloth_config: "11.1.118", obfuscated: true, java: 17],
        "1.21.1-neoforge": [minecraft: "1.21.1", minecraft_dependency: "1.21.1", neoforge: "21.1.240", cloth_config: "15.0.140", obfuscated: true, java: 21],
        "1.21.1-fabric":   [minecraft: "1.21.1", minecraft_dependency: "1.21.1", fabric: "0.116.0+1.21.1", loader: "0.19.3", cloth_config: "15.0.140", modmenu: "11.0.4", obfuscated: true, java: 21],
        "1.21.11-neoforge":[minecraft: "1.21.11", minecraft_dependency: ">=1.21.6 <=1.21.11", neoforge: "21.11.42", cloth_config: "21.11.153", obfuscated: true, java: 21],
        "1.21.11-fabric":  [minecraft: "1.21.11", minecraft_dependency: ">=1.21.6 <=1.21.11", fabric: "0.140.0+1.21.11", loader: "0.19.3", cloth_config: "21.11.153", modmenu: "17.0.0", obfuscated: true, java: 21],
        "26.1.2-fabric":   [minecraft: "26.1.2", minecraft_dependency: ">=26.1 <=26.1.2", fabric: "0.150.0+26.1.2", cloth_config: "26.1.154", modmenu: "18.0.0", java: 25],
        "26.1.2-neoforge": [minecraft: "26.1.2", minecraft_dependency: ">=26.1 <=26.1.2", neoforge: "26.1.0.19-beta", cloth_config: "26.1.154", java: 25],
        "26.2-fabric":     [minecraft: "26.2", minecraft_dependency: "26.2", fabric: "0.155.2+26.2", cloth_config: "26.2.155", modmenu: "20.0.1", java: 25],
        "26.3-fabric":     [minecraft: "26.3", minecraft_dependency: "26.3", fabric: "0.160.5+26.3", cloth_config: "26.3.158", modmenu: "21.0.0-beta.1", java: 25],
        "26.2-neoforge":   [minecraft: "26.2", minecraft_dependency: "26.2", neoforge: "26.2.0.60", cloth_config: "26.2.155", java: 25],
        "26.3-neoforge":   [minecraft: "26.3", minecraft_dependency: "26.3", neoforge: "26.3.0.10-beta", cloth_config: "26.3.158", java: 25],
]

def nodeName = stonecutter.current.project
def loader = nodeName.substring(nodeName.lastIndexOf('-') + 1)
def isFabric = loader == 'fabric'
def isNeoForge = loader == 'neoforge'
def isForge = loader == 'forge'
def isObfuscated = (dependencyVersions[nodeName]?.obfuscated) ?: false

if (isFabric) {
    apply plugin: 'dev.kikugie.loom-back-compat'
} else if (isNeoForge) {
    apply plugin: 'net.neoforged.moddev'
} else if (isForge) {
    apply plugin: 'net.minecraftforge.gradle'
}

if (project.hasProperty('stonecutter')) {
    def currentVersions = dependencyVersions[nodeName]
    project.ext.minecraft_version = currentVersions.minecraft
    project.ext.minecraft_dependency = currentVersions.minecraft_dependency ?: "~${currentVersions.minecraft}"
    project.ext.cloth_config_version = currentVersions.cloth_config
    project.ext.is_obfuscated = isObfuscated
    if (isFabric) {
        project.ext.fabric_version = currentVersions.fabric
        project.ext.modmenu_version = currentVersions.modmenu
        if (currentVersions.loader) {
            project.ext.loader_version = currentVersions.loader
        }
    } else if (isNeoForge) {
        project.ext.neoforge_version = currentVersions.neoforge
    } else if (isForge) {
        project.ext.forge_version = currentVersions.forge
    }
}

base {
    archivesName = "${project.archives_base_name}-${project.version}+${project.minecraft_version}-${loader}"
}

jar {
    archiveVersion = ""
}

repositories {
    maven { name = "Cloth Config"; url = "https://maven.shedaniel.me/" }
    if (isFabric) {
        maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
        maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/" }
    }
    if (isNeoForge) {
        maven { name = "Mojang"; url = "https://libraries.minecraft.net" }
    }
    if (isForge) {
        maven { name = "Forge"; url = "https://maven.minecraftforge.net" }
    }
}

dependencies {
    if (isFabric) {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        if (project.is_obfuscated) {
            mappings loom.layered {
                officialMojangMappings()
            }
        }
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
        modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
        modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    } else if (isNeoForge) {
        implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
    } else if (isForge) {
        minecraft "net.minecraftforge:forge:${project.forge_version}"
        implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:${project.cloth_config_version}")
    }
}

if (isNeoForge) {
    neoForge {
        version = project.neoforge_version
        validateAccessTransformers = true
        runs {
            client { client() }
            server { server() }
        }
        mods {
            "spatial_gui" {
                sourceSet sourceSets.main
            }
        }
    }
}

if (isForge) {
    minecraft {
        mappings channel: 'official', version: project.minecraft_version
        copyIdeResources = true
        runs {
            client {
                workingDirectory project.file('run')
                property 'forge.logging.console.level', 'info'
                mods {
                    spatial_gui {
                        source sourceSets.main
                    }
                }
            }
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filteringCharset "UTF-8"

    if (isFabric) {
        exclude "META-INF/neoforge.mods.toml"
        exclude "META-INF/mods.toml"
        inputs.property "loader_version", project.loader_version
        inputs.property "minecraft_dependency", project.minecraft_dependency
        inputs.property "cloth_config_version", project.cloth_config_version
        filesMatching("fabric.mod.json") {
            expand "version": project.version,
                    "minecraft_dependency": project.minecraft_dependency,
                    "minecraft_version": project.minecraft_version,
                    "loader_version": project.loader_version,
                    "cloth_config_version": project.cloth_config_version
        }
    } else if (isNeoForge) {
        exclude "fabric.mod.json"
        exclude "META-INF/mods.toml"
        inputs.property "neoforge_version", project.neoforge_version
        inputs.property "minecraft_dependency", project.minecraft_dependency
        filesMatching("META-INF/neoforge.mods.toml") {
            expand "version": project.version,
                    "minecraft_version": project.minecraft_version,
                    "neoforge_version": project.neoforge_version,
                    "minecraft_dependency": project.minecraft_dependency
        }
    } else if (isForge) {
        exclude "fabric.mod.json"
        exclude "META-INF/neoforge.mods.toml"
        inputs.property "minecraft_dependency", project.minecraft_dependency
        filesMatching("META-INF/mods.toml") {
            expand "version": project.version,
                    "minecraft_version": project.minecraft_version,
                    "minecraft_dependency": project.minecraft_dependency
        }
    }
}

def targetJavaVersion = dependencyVersions[nodeName]?.java ?: 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
